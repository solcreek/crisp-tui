name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            node: "22.12.0"
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            node: "24"
          - os: macos-latest
            platform: darwin-arm64
            node: "24"
          - os: macos-15-intel
            platform: darwin-x64
            node: "22.12.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:coverage
      - run: bun run test:package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage/lcov.info
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: dist/npm/*.tgz
          if-no-files-found: error
